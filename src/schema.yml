          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/tasks/{task_id}:
    get:
      operationId: tasks_retrieve
      description: |-
        Get status of a source capture task.

        Args:
            task_id (str): The Celery task ID returned from async request

        Returns:
            - 200: Task status with result (if SUCCESS) or error (if FAILURE)
            - 503: Task backend (Redis) unavailable
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
        required: true
      tags:
      - tasks
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
